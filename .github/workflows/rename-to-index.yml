name: Rename portfolio file to index.html

on:
  push:
    paths:
      - .github/workflows/rename-to-index.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename portfolio file to index.html
        run: |
          git config user.name "rafsan2980"
          git config user.email "rafsan2980@users.noreply.github.io"
          if [ -f rafsan-rafin-portfolio.html ] && [ ! -f index.html ]; then
            git mv rafsan-rafin-portfolio.html index.html
            git commit -m "Rename rafsan-rafin-portfolio.html to index.html"
            git push
          else
            echo "Nothing to rename"
          fi
